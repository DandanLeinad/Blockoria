[package]
name = "blockoria-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri 2 adapter for Blockoria — Minecraft Bedrock Backup Manager"
publish = false

[lib]
name = "blockoria_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "blockoria-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blockoria-domain = { path = "../crates/blockoria-domain", features = ["serde"] }
blockoria-application = { path = "../crates/blockoria-application" }
blockoria-infrastructure = { path = "../crates/blockoria-infrastructure" }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.23.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
