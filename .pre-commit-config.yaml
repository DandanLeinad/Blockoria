---
default_language_version:
  python: python3.14

default_stages: [pre-commit]
fail_fast: false


repos:

  # Conventional Commits
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"


  # Rust Workspace
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:

      - id: fmt
        name: rustfmt
        args: ["--check"]
        pass_filenames: false

      - id: clippy
        name: clippy
        args:
          [
            "--workspace",
            "--all-targets",
            "--",
            "-D",
            "warnings"
          ]


  # Arquivos gerais
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      - id: trailing-whitespace

      - id: end-of-file-fixer

      - id: check-yaml

      - id: check-added-large-files
        args:
          [
            "--maxkb=4000"
          ]

      - id: check-merge-conflict

      - id: mixed-line-ending
        args:
          [
            "--fix=lf"
          ]

      - id: check-json
        exclude: ^app/tsconfig\.(app|node)\.json$

      - id: check-toml

      - id: check-case-conflict


  # YAML lint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:

      - id: yamllint


  # Scripts próprios
  - repo: local
    hooks:

      # DCO Signed-off-by
      - id: dco-signed-off-by
        name: DCO — Signed-off-by check
        language: python
        entry: python scripts/dco_check.py
        stages:
          [
            commit-msg
          ]


      # SPDX Rust + frontend
      - id: validate-license-header
        name: Validate SPDX license header
        language: python
        entry: python scripts/validate_license_header.py
        stages:
          [
            pre-commit
          ]
        pass_filenames: true
        files: ^(crates/|src-tauri/|app/|scripts/|tests/|docs/)
        types: [rust, javascript, jsx, ts, tsx, css, html]


      # Validação completa antes do push
      - id: validate-license-header-all
        name: Validate SPDX license header (all Rust files)
        language: python
        entry: python scripts/validate_license_header.py --all
        stages:
          [
            pre-push
          ]
        pass_filenames: false


  # TypeScript / React / Frontend (app/) - local hooks
  - repo: local
    hooks:
      - id: eslint-check
        name: ESLint check (app/)
        language: system
        entry: bunx eslint --max-warnings=0
        files: ^app/
        types: [javascript, jsx, tsx]
        stages: [pre-commit]

      - id: prettier-check
        name: Prettier check (app/)
        language: system
        entry: bunx prettier --check
        files: ^app/
        types: [javascript, jsx, tsx, json, css, html, markdown, yaml]
        stages: [pre-commit]

      - id: prettier-fix
        name: Prettier fix (app/)
        language: system
        entry: bunx prettier --write
        files: ^app/
        types: [javascript, jsx, tsx, json, css, html, markdown, yaml]
        stages: [pre-commit]
        pass_filenames: true

      - id: tsc-check
        name: TypeScript type check (app/)
        language: python
        entry: |
          python -c "
          import subprocess, sys
          sys.exit(subprocess.run(
              ['bun', '--cwd', 'app', 'run', 'tsc', '--noEmit'],
              shell=False
          ).returncode)
          "
        files: ^app/
        pass_filenames: false
        stages: [pre-commit]
