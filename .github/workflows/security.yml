---
name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1'  # weekly on Monday 6 AM UTC

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (registry + git + target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-binstall
        run: cargo install cargo-binstall --locked

      - name: Install cargo-audit (pre-built binary)
        run: cargo binstall cargo-audit --no-confirm --locked

      - name: Run security audit
        run: cargo audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Check for vulnerabilities
        run: |
          if [ -s audit-report.json ]; then
            echo "::warning::Security vulnerabilities found"
            cat audit-report.json |
              jq -r '
                (.vulnerabilities // [])[]?.advisory?.title //
                .vulnerabilities[]?.title // empty
              ' || true
          else
            echo "No vulnerabilities found"
          fi
