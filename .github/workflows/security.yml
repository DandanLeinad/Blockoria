---
name: Security Audit

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  "Security Audit":
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (registry + git + target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-binstall
        run: cargo +stable install cargo-binstall --locked

      - name: Install cargo-audit
        run: cargo binstall cargo-audit -y

      # 1) Evita warning de crate yanked no lock antigo
      # (não usa --locked na auditoria)
      - name: Run cargo audit (JSON)
        run: |
          set -euo pipefail
          cargo audit --json > audit-report.json || true

      # 2) Mostra incompatibilidades futuras de Rust
      # sem quebrar o job
      - name: Future incompatibility report
        run: |
          set -euo pipefail
          cargo report future-incompatibilities || true

      # 3) Parsing robusto do JSON (corrige erro do jq)
      - name: Parse audit report
        run: |
          set -euo pipefail

          if [ ! -s audit-report.json ]; then
            echo "audit-report.json vazio ou inexistente"
            exit 0
          fi

          # Conta vulnerabilidades de forma tolerante a formato
          COUNT="$(jq -r '
            if type=="object" then
              if (.vulnerabilities|type)=="object" and
                 (.vulnerabilities.list|type)=="array" then
                (.vulnerabilities.list | length)
              elif (.vulnerabilities|type)=="array" then
                (.vulnerabilities | length)
              else
                0
              end
            elif type=="array" then
              length
            else
              0
            end
          ' audit-report.json 2>/dev/null || echo 0)"

          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "Warning: Security vulnerabilities found (${COUNT})"

            # Imprime títulos sem quebrar se houver boolean/null
            jq -r '
              if type=="object" and
                 (.vulnerabilities|type)=="object" and
                 (.vulnerabilities.list|type)=="array" then
                .vulnerabilities.list[]
              elif type=="object" and
                 (.vulnerabilities|type)=="array" then
                .vulnerabilities[]
              elif type=="array" then
                .[]
              else
                empty
              end
              | select(type=="object")
              | "- \(.advisory.title // .title // "Untitled advisory")"
            ' audit-report.json 2>/dev/null || true
          else
            echo "No known vulnerabilities found"
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30
