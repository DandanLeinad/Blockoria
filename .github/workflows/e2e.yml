---
# .github/workflows/e2e.yml
name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Generate test fixtures to project (for copy step)
        run: |
          GEN_FIXTURES_TO_PROJECT=1 cargo run --release \
            --example gen_test_worlds \
            --manifest-path crates/blockoria-infrastructure/Cargo.toml

      - name: Install Playwright Chromium
        working-directory: app
        run: bunx playwright install --with-deps chromium

      - name: Copy test fixtures to temp directory
        run: |
          mkdir -p "${{ runner.temp }}/blockoria-test-worlds"
          cp -r app/e2e/fixtures/worlds/Users \
            "${{ runner.temp }}/blockoria-test-worlds/"

      - name: Run E2E tests
        env:
          BLOCKORIA_TEST_WORLDS_DIR: ${{ runner.temp }}/blockoria-test-worlds
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222
        working-directory: app
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 7
