---
name: DCO Signed-off-by Check

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dco:
    name: Validate Signed-off-by trailers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailers
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "Checking commits in $RANGE"

          for commit in $(git rev-list "$RANGE"); do
            trailer=$(git log -1 \
              --format='%(trailers:key=Signed-off-by)' \
              "$commit")

            if [ -z "$trailer" ]; then
              echo "::error::Commit $commit is missing Signed-off-by"
              echo "Use: git commit -s"
              exit 1
            fi
          done
