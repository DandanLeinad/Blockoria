[workspace]
resolver = "3"

members = [
    "crates/blockoria-application",
    "crates/blockoria-domain",
    "crates/blockoria-infrastructure",
    "src-tauri",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["DandanLeinad <141470228+DandanLeinad@users.noreply.github.com>"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
